allowBuilds:
  esbuild: true
overrides:
  # tsup and vite both float postcss on a range that still resolves to 8.5.16,
  # which carries GHSA-r28c-9q8g-f849 (path traversal). Dev-only -- postcss never
  # ships, `files` is dist + data -- but pin it so `pnpm audit` stays clean.
  postcss: '>=8.5.18'
  # tsup pins esbuild ^0.27.0 but the fix for GHSA-g7r4-m6w7-qqqr is 0.28.1, so
  # clearing it means stepping outside tsup's declared range. Verified: build and
  # the 98-test suite pass on 0.28.1. Same dev-only reasoning as postcss.
  esbuild: '>=0.28.1'
  # The MCP SDK resolves hono 4.12.27 (directly and via @hono/node-server), which
  # carries GHSA-f23p-vx2j-j53r, GHSA-79qm-7rj5-m7r9, GHSA-54fx-42gc-7vw4 and
  # GHSA-8j4g-w8fx-2239. Runtime -- the SDK is a real dependency -- so pin the fix.
  hono: '>=4.12.34'
  # ajv (via the MCP SDK) resolves fast-uri 3.1.4, which carries
  # GHSA-7p8r-x3mc-p8w7 (high). Runtime, same reasoning as hono. Capped below 4
  # so ajv stays inside its declared ^3 range.
  fast-uri: '>=3.1.5 <4'
  # express-rate-limit (via the MCP SDK) resolves ip-address 10.2.0, which carries
  # GHSA-mwp4-54f8-5fhr (high), GHSA-4xrf-jv44-h6hh and GHSA-22jq-vg5j-6vgg.
  # Runtime, same reasoning as hono.
  ip-address: '>=10.3.1'
  # express and body-parser (via the MCP SDK) resolve qs 6.15.3, which carries
  # GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled isBuffer) and
  # GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing).
  # Runtime, same reasoning as hono.
  qs: '>=6.16.0'
  # postcss (via tsup and vite) resolves nanoid 3.3.11, which carries
  # GHSA-2v37-7h3g-55p8 (high). Dev-only, same reasoning as postcss. Capped below
  # 4 because nanoid 4+ is ESM-only and postcss requires it as CJS.
  nanoid: '>=3.3.18 <4'
# Nothing in this repo sets `minimumReleaseAge`, but a contributor's global pnpm
# config can, and this list is what lets a fresh `pnpm install --frozen-lockfile`
# resolve the exact versions the lockfile already pins. Refresh it to the
# resolved versions on every dependency bump rather than dropping it: an entry
# only ever matches the version it names, so a stale list is the same as no list.
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.30.0'
  - 'zod@4.5.4'
  - '@types/node@26.4.1'
  - '@biomejs/biome@2.5.12'
  - '@biomejs/cli-darwin-arm64@2.5.12'
  - '@biomejs/cli-darwin-x64@2.5.12'
  - '@biomejs/cli-linux-arm64-musl@2.5.12'
  - '@biomejs/cli-linux-arm64@2.5.12'
  - '@biomejs/cli-linux-x64-musl@2.5.12'
  - '@biomejs/cli-linux-x64@2.5.12'
  - '@biomejs/cli-win32-arm64@2.5.12'
  - '@biomejs/cli-win32-x64@2.5.12'
  - 'vitest@4.1.11'
  - '@vitest/expect@4.1.11'
  - '@vitest/mocker@4.1.11'
  - '@vitest/pretty-format@4.1.11'
  - '@vitest/runner@4.1.11'
  - '@vitest/snapshot@4.1.11'
  - '@vitest/spy@4.1.11'
  - '@vitest/utils@4.1.11'
