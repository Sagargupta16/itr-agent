allowBuilds:
  esbuild: true
overrides:
  # tsup and vite both float postcss on a range that still resolves to 8.5.16,
  # which carries GHSA-r28c-9q8g-f849 (path traversal). Dev-only -- postcss never
  # ships, `files` is dist + data -- but pin it so `pnpm audit` stays clean.
  postcss: '>=8.5.18'
  # postcss (via tsup and vite) resolves nanoid 3.3.11, which carries
  # GHSA-2v37-7h3g-55p8 (high). Dev-only, same reasoning as postcss. Capped below
  # 4 because nanoid 4+ is ESM-only and postcss requires it as CJS.
  nanoid: '<7'
  # postcss (via tsup and vite) resolves source-map-js 1.2.1, which carries
  # GHSA-68fv-2mgg-jv7q (high). Dev-only, same reasoning as postcss. Capped below
  # 2 to stay inside postcss's declared ^1.2.1 range.
  source-map-js: '>=1.2.2 <2'
  # vitest resolves vite 8.1.3, which carries GHSA-587h-7wmj-h5pm (high),
  # GHSA-r825-w8mm-5pxw, GHSA-698v-4r3x-3vcv, GHSA-rq7h-c2jc-7f22 and
  # GHSA-9jrq-w75r-8gcw. vitest takes vite as an auto-installed peer, which
  # `pnpm update` leaves alone, so the fix needs an override. Dev-only, same
  # reasoning as postcss. Capped below 9 to stay inside vitest's declared ^8.
  vite: '>=8.1.6 <9'
# Nothing in this repo sets `minimumReleaseAge`, but a contributor's global pnpm
# config can, and this list is what lets a fresh `pnpm install --frozen-lockfile`
# resolve the exact versions the lockfile already pins. Refresh it to the
# resolved versions on every dependency bump rather than dropping it: an entry
# only ever matches the version it names, so a stale list is the same as no list.
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/server@2.4.0'
  - '@modelcontextprotocol/core@2.4.0'
  - '@modelcontextprotocol/client@2.4.0'
  - 'zod@4.6.7'
  - '@types/node@26.6.5'
  - '@biomejs/biome@2.5.15'
  - '@biomejs/cli-darwin-arm64@2.5.15'
  - '@biomejs/cli-darwin-x64@2.5.15'
  - '@biomejs/cli-linux-arm64-musl@2.5.15'
  - '@biomejs/cli-linux-arm64@2.5.15'
  - '@biomejs/cli-linux-x64-musl@2.5.15'
  - '@biomejs/cli-linux-x64@2.5.15'
  - '@biomejs/cli-win32-arm64@2.5.15'
  - '@biomejs/cli-win32-x64@2.5.15'
  - 'tsup@9.0.0'
  - 'vitest@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
