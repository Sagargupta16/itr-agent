name: Publish

on:
  release:
    types: [published]
  # Manual run: every check below runs, including the trusted-publisher
  # diagnostic, and nothing is published or uploaded. Use it to find out why
  # npmjs.com refuses this workflow without cutting another release.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) != release tag ($TAG)" >&2
            exit 1
          fi
          # server.json feeds the MCP registry and carries the version twice.
          SERVER_VERSION=$(node -p "require('./server.json').version")
          PKG_VERSION_IN_SERVER=$(node -p "require('./server.json').packages[0].version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          SERVER_NAME=$(node -p "require('./server.json').name")
          if [ "$SERVER_VERSION" != "$TAG" ] || [ "$PKG_VERSION_IN_SERVER" != "$TAG" ]; then
            echo "server.json versions ($SERVER_VERSION / $PKG_VERSION_IN_SERVER) != release tag ($TAG)" >&2
            exit 1
          fi
          if [ "$MCP_NAME" != "$SERVER_NAME" ]; then
            echo "package.json mcpName ($MCP_NAME) != server.json name ($SERVER_NAME)" >&2
            exit 1
          fi

      - name: Check CHANGELOG has an entry for this version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "^## \[\?${PKG_VERSION}\]\?" CHANGELOG.md; then
            echo "CHANGELOG.md has no heading for ${PKG_VERSION}" >&2
            exit 1
          fi

      # Publish the exact artifact we just verified. v0.3.0 went out by hand and
      # so carries no attestations; --provenance makes the signed build
      # provenance mandatory, which only works from a workflow with id-token.
      - name: Verify the tarball runs before publishing
        run: |
          npm pack --silent
          TARBALL=$(realpath itr-agent-*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y --silent > /dev/null
          npm install --silent "$TARBALL"
          out=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"compute_tax","arguments":{"regime":"new","otherIncome":1500000}}}' \
            | npx itr-agent 2>/dev/null)
          node -e '
            const msg = process.argv[1].split("\n").filter(Boolean).map(JSON.parse)
              .find((m) => m.id === 2);
            const total = msg && msg.result && msg.result.structuredContent
              && msg.result.structuredContent.totalTax;
            if (total !== 109200) {
              throw new Error(`release candidate computed ${total}, expected 109200`);
            }
            console.log("ok release candidate computes 1,09,200");
          ' "$out"

      # npm's CLI does the OIDC token exchange itself and, when npmjs.com
      # refuses, logs the registry's reason only at verbose level before falling
      # back to whatever credentials exist (none) and failing the PUT with a bare
      # E404. That same E404 covers a missing link, a mismatched field, and a
      # link whose allowed actions stop at `npm stage publish`. So do the
      # exchange here first: print the id-token claims npm matches against the
      # configured publisher, then the registry's answer, with any token
      # redacted. A refusal fails the job with the actual reason.
      - name: Check the npmjs.com trusted publisher link
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          resp=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          idtoken=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).value)' "$resp")
          node -e '
            const payload = process.argv[1].split(".")[1];
            const c = JSON.parse(Buffer.from(payload, "base64url").toString());
            const keys = ["repository", "repository_owner", "repository_visibility", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name", "aud"];
            for (const k of keys) console.log(`${k}: ${c[k] === undefined ? "(absent)" : c[k]}`);
          ' "$idtoken"
          status=$(curl -sS -o exchange.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${idtoken}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG}")
          node -e '
            const fs = require("node:fs");
            const status = process.argv[1];
            const raw = fs.readFileSync("exchange.json", "utf8");
            let body;
            try { body = JSON.parse(raw); } catch { body = { raw: raw.slice(0, 500) }; }
            const hasToken = typeof body.token === "string" && body.token.length > 0;
            if (hasToken) body.token = "<redacted>";
            console.log(`exchange HTTP ${status}: ${JSON.stringify(body)}`);
            if (status !== "200" || !hasToken) {
              console.error("npmjs.com did not issue a publish token for this workflow. On the package settings page, make the trusted publisher match the claims above: owner, repository, workflow filename publish.yml, environment blank; and allow npm publish, not only npm stage publish.");
              process.exit(1);
            }
            console.log("ok npmjs.com accepts this workflow as a trusted publisher");
          ' "$status"
          rm -f exchange.json

      # No token: authenticated via OIDC trusted publishing configured on npmjs.com
      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --access public --provenance

      - name: Confirm the published version carries provenance
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            if npm view "itr-agent@${PKG_VERSION}" dist.attestations --json | grep -q 'provenance'; then
              echo "ok itr-agent@${PKG_VERSION} has provenance attestations"
              exit 0
            fi
            echo "registry not caught up yet (attempt ${attempt}), retrying in 15s"
            sleep 15
          done
          echo "published ${PKG_VERSION} without provenance attestations" >&2
          exit 1

      # MCP registry listing (the registry is in preview). It verifies namespace
      # ownership via the same GitHub OIDC token, and package ownership by
      # reading `mcpName` out of the PUBLISHED npm tarball -- so this has to run
      # after `npm publish`, not before.
      #
      # Both steps are continue-on-error BECAUSE they run after `npm publish`,
      # which cannot be undone. If the preview registry rejects the listing the
      # release is still correct on npm and the two commands can be re-run by
      # hand; failing the workflow here would only mark a good release red.
      # GitHub still surfaces the failure as a step annotation.
      - name: Install mcp-publisher
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          # Pinned deliberately. `releases/latest` fetches a different binary on
          # every release with nothing asserting what it is, inside the same job
          # whose other half exists to enforce npm provenance.
          MCP_PUBLISHER_VERSION: 1.8.1
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$asset" "${base}/${asset}"
          # The release signs one checksums file covering every asset; verify the
          # tarball against it before unpacking anything.
          curl -fsSL -o checksums.txt "${base}/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt > expected.sha256
          test -s expected.sha256
          sha256sum -c expected.sha256
          tar xzf "$asset" mcp-publisher
          chmod +x mcp-publisher
          rm -f "$asset" checksums.txt expected.sha256

      - name: Publish to the MCP registry
        if: github.event_name == 'release'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f ./mcp-publisher ]; then
            echo "mcp-publisher is not present (its install step failed); skipping the registry listing" >&2
            exit 1
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  bundle:
    # The one-click Claude Desktop bundle (.mcpb), attached to the same GitHub
    # release. A separate job so a failed npm publish does not withhold the
    # bundle, and so only this job holds contents: write (release upload).
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # pnpm bundle runs `pnpm dlx @anthropic-ai/mcpb`, whose dependency tree no
      # lockfile pins. Keep the write token out of .git/config while it runs;
      # gh release upload below reads GH_TOKEN from its own env instead.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Builds a fully inlined server, validates manifest.json with the official
      # mcpb CLI, boots the staged bundle outside the repo and checks it
      # computes 1,09,200 before packing.
      - run: pnpm bundle

      - name: Attach the bundle and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE="build/itr-agent-${GITHUB_REF_NAME#v}.mcpb"
          if [ ! -f "$BUNDLE" ]; then
            echo "expected $BUNDLE; package.json version does not match the tag" >&2
            exit 1
          fi
          (cd build && sha256sum "$(basename "$BUNDLE")" > "$(basename "$BUNDLE").sha256")
          gh release upload "$GITHUB_REF_NAME" "$BUNDLE" "$BUNDLE.sha256" --clobber
